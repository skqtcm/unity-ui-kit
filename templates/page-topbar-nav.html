<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topbar Navigation — Unity UI Kit Template</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="../unity-ui-kit.css" rel="stylesheet">
<script src="../unity-ui-kit.js" defer></script>
</head>
<body>
<div class="unity-page">

  <!-- Topbar branded (logged out / gradient) -->
  <div class="unity-topbar-branded">
    <div class="unity-topbar-logo">
      <img src="../assets/logo-lqtchs-white.svg" alt="Leidos QTC Health Services">
    </div>
  </div>

  <!-- Content -->
  <div class="unity-content">
    <div class="unity-grid">
      <div class="unity-col-4"></div>
      <div class="unity-col-4">
        <div class="unity-page-header">
          <h1 class="unity-h2">Welcome</h1>
        </div>

        <div class="unity-card">
          <div class="unity-card-header">
            <h3 class="unity-card-title">Sign In</h3>
          </div>
          <div class="unity-col unity-gap-16">
            <div class="unity-form-field">
              <label class="unity-label unity-label-required">Username</label>
              <input class="unity-input" type="text" placeholder="Enter username">
            </div>
            <div class="unity-form-field">
              <label class="unity-label unity-label-required">Password</label>
              <input class="unity-input" type="password" placeholder="Enter password">
            </div>
            <button class="unity-btn unity-btn-primary unity-btn-lg unity-btn-block">Sign In</button>
          </div>
        </div>
      </div>
      <div class="unity-col-4"></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="unity-footer">
    <div class="unity-footer-cui">Controlled Unclassified Information</div>
    <div class="unity-footer-row">
      <div class="unity-footer-copyright">Copyright &copy; 1980-2026 <a href="#">QTC - A Leidos Company</a></div>
      <div class="unity-footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms of Use</a>
        <a href="#">Accessibility/Section 508</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
